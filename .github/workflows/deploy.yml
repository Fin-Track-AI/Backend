name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: fintrack-backend-508320
  REGION: asia-south1
  REPOSITORY: fintrack-backend
  SERVICE: fintrack-backend-api
  IMAGE: asia-south1-docker.pkg.dev/fintrack-backend-508320/fintrack-backend/api

jobs:
  deploy:
    name: Lint, Test & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            NODE_ENV=production
            PORT=8080
            CLIENT_URL=${{ secrets.CLIENT_URL }}
          secrets: |
            MONGO_URI=MONGO_URI:latest
            JWT_SECRET=JWT_SECRET:latest

      - name: Show deployed URL
        run: echo "✅ Deployed to ${{ steps.deploy.outputs.url }}"
